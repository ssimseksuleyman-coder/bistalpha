<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIST Alpha Dashboard</title>
<style>
  :root {
    --bg: #f6f7f4;
    --panel: #ffffff;
    --ink: #182018;
    --muted: #687066;
    --line: #dfe5dc;
    --soft: #eef2ea;
    --green: #0c7a55;
    --yellow: #a26f00;
    --red: #b23737;
    --blue: #2463a6;
    --shadow: 0 12px 32px rgba(24, 32, 24, .08);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 18px 0 36px; }
  header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: end;
    padding: 10px 0 18px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 26px; line-height: 1.05; letter-spacing: 0; }
  .subtitle { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    padding: 8px 10px;
    min-height: 34px;
    color: var(--muted);
    box-shadow: 0 1px 0 rgba(0,0,0,.02);
  }
  button.pill { cursor: pointer; color: var(--ink); }
  button.pill:hover { border-color: #c5cec1; }

  .grid { display: grid; grid-template-columns: 1.55fr .85fr; gap: 14px; margin-top: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  h2 { margin: 0; font-size: 15px; line-height: 1.2; letter-spacing: 0; }
  .stamp { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px 16px; }
  .stat { border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 12px; min-height: 78px; }
  .stat-value { font-size: 22px; line-height: 1; font-weight: 750; color: var(--ink); }
  .stat-label { color: var(--muted); font-size: 12px; margin-top: 7px; }

  .list { padding: 8px 10px 12px; }
  .row {
    display: grid;
    grid-template-columns: 32px 1fr 88px 82px;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding: 11px 6px;
  }
  .row:last-child { border-bottom: 0; }
  .rank {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: var(--soft);
    color: var(--muted);
    font-weight: 700;
  }
  .ticker { font-size: 15px; font-weight: 750; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .m252 { text-align: right; font-weight: 700; }
  .action { justify-self: end; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 700; }
  .action.AL { color: var(--green); background: #ddf0e7; }
  .action.BEKLE { color: var(--yellow); background: #fbefcf; }
  .action.SAT { color: var(--red); background: #f7dddd; }
  .action.FIRSAT { color: var(--blue); background: #dcecff; }

  .accounts { display: grid; gap: 12px; padding: 14px 16px; }
  .account {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    background: #fbfcfa;
  }
  .account-title { display: flex; justify-content: space-between; gap: 10px; font-weight: 750; }
  .position { display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding-top: 8px; font-size: 12px; }
  .notice { margin-top: 14px; padding: 12px 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; background: #fffdf7; }
  .error { color: var(--red); padding: 14px 16px; }

  @media (max-width: 820px) {
    .shell { width: min(100% - 18px, 680px); padding-top: 10px; }
    header { grid-template-columns: 1fr; align-items: start; }
    .toolbar { justify-content: flex-start; }
    .grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 30px 1fr 74px; }
    .action { grid-column: 2 / 4; justify-self: start; margin-top: -3px; }
  }
</style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>BIST Alpha</h1>
        <div class="subtitle" id="subtitle">Veri yukleniyor</div>
      </div>
      <div class="toolbar">
        <span class="pill" id="status">Baglaniyor</span>
        <button class="pill" id="refresh" type="button">Yenile</button>
      </div>
    </header>

    <section class="grid">
      <div class="card">
        <div class="card-head">
          <h2>Top 10 Sinyal</h2>
          <span class="stamp" id="topStamp"></span>
        </div>
        <div class="list" id="topList"></div>
      </div>

      <aside>
        <div class="card">
          <div class="card-head">
            <h2>Ozet</h2>
            <span class="stamp" id="modeStamp"></span>
          </div>
          <div class="stats">
            <div class="stat"><div class="stat-value" id="statDate">-</div><div class="stat-label">Tarih</div></div>
            <div class="stat"><div class="stat-value" id="statMode">-</div><div class="stat-label">Mod</div></div>
            <div class="stat"><div class="stat-value" id="statTop">-</div><div class="stat-label">Oneri</div></div>
            <div class="stat"><div class="stat-value" id="statPos">-</div><div class="stat-label">A/B/F pozisyon</div></div>
            <div class="stat"><div class="stat-value" id="statSource">-</div><div class="stat-label">Kaynak</div></div>
            <div class="stat"><div class="stat-value" id="statCount">-</div><div class="stat-label">Hisse</div></div>
            <div class="stat"><div class="stat-value" id="statUniverse">-</div><div class="stat-label">Dinamik evren</div></div>
            <div class="stat"><div class="stat-value" id="statLastData">-</div><div class="stat-label">Son veri</div></div>
          </div>
        </div>

        <div class="card" style="margin-top:14px">
          <div class="card-head">
            <h2>Shadow Hesaplar</h2>
          </div>
          <div class="accounts" id="accounts"></div>
        </div>

        <div class="notice">Tek rejim verisiyle kalibre edilir. Yatirim tavsiyesi degildir.</div>
      </aside>
    </section>
  </main>

<script>
const el = id => document.getElementById(id);
const esc = value => String(value == null ? '' : value)
  .replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function fmtTime(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
}

function actionClass(action) {
  return ['AL', 'BEKLE', 'SAT', 'FIRSAT'].includes(action) ? action : 'BEKLE';
}

function detailText(item) {
  const parts = [item.sector, item.sm_signal].filter(Boolean);
  const side = item.yan_kaynak || {};
  if (side.deniz_skor != null) parts.push('Deniz:' + side.deniz_skor);
  if (side.hacim) parts.push(side.hacim);
  if (side.yabanci || side.yabancı) parts.push(side.yabanci || side.yabancı);
  if (side.bilanco || side.bilanço) parts.push('bilanco:' + (side.bilanco || side.bilanço));
  if (side.fx_risk) parts.push('FX-risk');
  if (side.sezonsal) parts.push(side.sezonsal);
  return parts.join(' | ');
}

function renderTop(items) {
  if (!items || !items.length) {
    el('topList').innerHTML = '<div class="error">Top 10 verisi henuz yok.</div>';
    return;
  }
  el('topList').innerHTML = items.map(item => `
    <div class="row">
      <div class="rank">${esc(item.rank)}</div>
      <div>
        <div class="ticker">${esc(item.ticker)}</div>
        <div class="meta">${esc(detailText(item))}</div>
      </div>
      <div class="m252">%${esc(item.m252 ?? '-')}</div>
      <div class="action ${actionClass(item.action)}">${esc(item.action || '-')}</div>
    </div>
  `).join('');
}

function renderAccounts(accounts) {
  const names = ['A', 'B', 'F'];
  el('accounts').innerHTML = names.map(name => {
    const acc = accounts?.[name];
    if (!acc) return `<div class="account"><div class="account-title">Hesap ${name}<span>-</span></div><div class="empty">Veri yok</div></div>`;
    if (acc.error) return `<div class="account"><div class="account-title">Hesap ${name}<span>Hata</span></div><div class="empty">${esc(acc.error)}</div></div>`;
    const positions = acc.positions || [];
    return `<div class="account">
      <div class="account-title"><span>Hesap ${name}</span><span>${esc(acc.n_positions ?? positions.length)} pozisyon</span></div>
      ${positions.length ? positions.slice(0, 8).map(p => `
        <div class="position"><strong>${esc(p.ticker)}</strong><span>Giris ${esc(p.entry)} | Zirve ${esc(p.peak)}</span></div>
      `).join('') : '<div class="empty">Henuz pozisyon yok</div>'}
    </div>`;
  }).join('');
}

async function loadDashboard() {
  el('status').textContent = 'Guncelleniyor';
  try {
    const response = await fetch('state/dashboard.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    const accounts = data.accounts || {};
    renderTop(data.top10 || []);
    renderAccounts(accounts);
    el('subtitle').textContent = `${data.label || 'otomatik'} calisma | ${fmtTime(data.timestamp)}`;
    el('topStamp').textContent = data.date || '';
    el('modeStamp').textContent = data.mode ? `Mod ${data.mode}` : '';
    el('statDate').textContent = data.date || '-';
    el('statMode').textContent = data.mode || '-';
    el('statTop').textContent = (data.top10 || []).length;
    el('statPos').textContent = ['A','B','F'].map(k => accounts[k]?.n_positions ?? '-').join('/');
    el('statSource').textContent = data.source || '-';
    el('statCount').textContent = data.price_count || '-';
    el('statUniverse').textContent = data.dynamic_universe_count || '-';
    el('statLastData').textContent = data.last_data_date || '-';
    el('status').textContent = 'Canli';
  } catch (error) {
    el('status').textContent = 'Hata';
    el('topList').innerHTML = `<div class="error">Dashboard verisi okunamadi: ${esc(error.message)}</div>`;
  }
}

el('refresh').addEventListener('click', loadDashboard);
loadDashboard();
setInterval(loadDashboard, 5 * 60 * 1000);
</script>
</body>
</html>
