# 7/24 OTONOM — Bilgisayar KAPALI iken GitHub bulutunda çalışır. Ücretsiz.
# Bu dosya DOĞRU konumda (.github/workflows/) — repo'ya push edince otomatik aktif.
#
# Secrets (repo Settings > Secrets > Actions): SMTP_HOST, SMTP_USER, SMTP_PASS,
#   MAIL_TO, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID (+ Deniz: IMAP_*, DENIZ_SENDER)
# TZ hedefleri: 09:45 TR=06:45 UTC | 14:30 TR=11:30 UTC | 18:40 TR=15:40 UTC
# GitHub cron dakikasi garanti degildir; retry pencereleri raporu yakalar,
# scripts/report_gate.py ayni slotun iki kez gonderilmesini engeller.

name: BIST Alpha 7-24 Canli

on:
  push:
    branches:
      - main
  schedule:
    - cron: '45,50,55 6 * * 1-5'
    - cron: '0,5,10,15,20,25,30 7 * * 1-5'
    - cron: '30,35,40,45,50,55 11 * * 1-5'
    - cron: '0,5,10,15,20 12 * * 1-5'
    - cron: '40,45,50,55 15 * * 1-5'
    - cron: '0,5,10,15,20,25,30 16 * * 1-5'
  workflow_dispatch:
    inputs:
      force_fail:
        description: "P0.3 hata alarmi kanalini kontrollu olarak sina"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Native fallback/manual rapor kendi kuyruğunda akar; precise workflow uzun uyur.
  # Çift rapor koruması report_runs.json üzerinden yapılır.
  group: bist-alpha-native
  cancel-in-progress: false

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - name: P0.3 kontrollu hata testi
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fail }}
        run: |
          echo "::error::P0.3 kontrollu hata — alarm kanali sinaniyor"
          exit 1

      - uses: actions/checkout@v4
      - name: En son state'i al
        run: git pull --rebase --autostash || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Kendi kendini test etme ve F golden-master
        if: github.event_name != 'schedule'
        # SELFTEST_REQUIRE_NODE: CI'da JS senaryolarini ATLAMAK YASAK.
        # Actions loglari kimlik dogrulamasi ister; "adim yesil" tek basina
        # kosucunun kostugunu SOYLEMEZ. Bu bayrak sayesinde node yoksa selftest
        # BLOKLAR -> "CI yesil" ifadesi "node vardi ve senaryolar gecti"yi
        # MANTIKEN icerir. Bayragin varligi selftest [6m] kancasiyla denetlenir.
        env:
          SELFTEST_REQUIRE_NODE: "1"
        run: python3 selftest.py

      - name: Planli tetik kapisi
        id: gate
        env:
          TZ: Europe/Istanbul
        run: python3 scripts/report_gate.py check

      - name: State klasorlerini hazirla
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p portfolios deniz_snapshots logs

      - name: Shadow + rapor (canli veri)
        if: steps.gate.outputs.run == 'true'
        env:
          TZ: Europe/Istanbul
          DATA_SOURCE: yahoo
          DATA_FALLBACK_CHAIN: "borsapy,file"
          ALLOW_FILE_FALLBACK: "0"
          YAHOO_BATCH_SIZE: "60"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DENIZ_SOURCE: scanner
          REPORT_GATE_LABEL: ${{ steps.gate.outputs.label }}
          REPORT_GATE_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          python3 daemon.py --once "${{ steps.gate.outputs.label }}"
          # P0.5: daemon izi OK kapatti; assert ve mark AYRI asamalar. Dusen adim
          # izi FAILED kapatmazsa state commit mesaji [OK] basardi. OLCULDU
          # 2026-09-11: bu yol gunici'yi HER GUN teslim ediyor (09-09 14:56, 09-10
          # 14:53; 107 "state HHMM" commit) — asagidaki "gate.run hic true olmuyor"
          # notu 07-22 olcumudur, artik gecersiz.
          # Faz yardimcilari `|| true`: iz ARIZA URETMEZ (fail-safe 1). Bu satir dusseydi
          # adim daemon'dan SONRA, mark'tan ONCE duserdi = senaryo D (gonderildi, isaretlenmedi).
          python3 -c "from bist_alpha import run_trace as r; r.phase('state_assert')" || true
          python3 - <<'PY' || { python3 -c "from bist_alpha import run_trace as r; r.end('FAILED', 'dashboard state assert dustu')"; exit 1; }
          import json
          from pathlib import Path
          d = json.loads(Path("docs/state/dashboard.json").read_text(encoding="utf-8"))
          source = d.get("source")
          price_count = d.get("price_count", 0)
          assert source == "yahoo" or str(source).startswith("borsapy_fallback_from_") or str(source).startswith("file_fallback_from_"), f"Beklenmeyen kaynak: {source}"
          assert price_count >= 50, price_count
          if source == "yahoo":
              assert d.get("source_pool_count", 0) >= price_count, (d.get("source_pool_count"), price_count)
          else:
              print(f"UYARI yedek veri kullanildi: {source}")
          assert d.get("dynamic_universe_count", 0) >= 50, d.get("dynamic_universe_count")
          print(f"OK dinamik kaynak: {d['source']} | BIST havuzu: {d.get('source_pool_count')} | canlı veri: {d.get('price_count')} | evren: {d.get('dynamic_universe_count')}")
          PY
          # P0.5: precise_runner ile simetrik — mark ayri asama (izde FAILED@mark gorunsun)
          python3 -c "from bist_alpha import run_trace as r; r.phase('mark')" || true
          python3 scripts/report_gate.py mark "${{ steps.gate.outputs.label }}" || { python3 -c "from bist_alpha import run_trace as r; r.end('FAILED', 'report_gate mark dustu')"; exit 1; }

      # BEKCI BURADAN KALDIRILDI (2026-07-22). Buradaki `gate.run` hic 'true'
      # olmuyor (raporu precise.yml uretiyor) -> bekci 40 kosuda 0 kez calisti.
      # Dogru yer: precise.yml (daemon'u fiilen kosturan workflow).
      # GUNCELLEME 2026-09-11 (olculdu): yukaridaki iddia BAYAT. Bu yol artik
      # gunici'yi her gun teslim ediyor (report_runs: 09-09 14:56 / 09-10 14:53
      # bist-alpha kosumlarindan; precise o saatte 15:17'de baslayip kapanisa
      # uyuyor). Bekci burada YOK -> gunici kosumunun bekcisi yalniz liveness.yml.
      # Yeri degistirmek P0.5 kapsami disi; ACIK_ISLER'e YAN bulgu olarak yazildi.

      - name: P0.6 stop gozlemi (bagimsiz, is olan her kosuda)
        # `id` VAR cunku runner GITHUB_OUTPUT'a breached/unpriced/positions/gate
        # yaziyor; id olmadan bu ciktilar hicbir yerden adreslenemez ve yazilip
        # okunmayan bir yuzey olarak kalirdi.
        id: stop_obs
        # P0.6/madde-7 — bagimsiz stop observer. Ana yol (daemon) DUSSE BILE calisir:
        # 2026-09-08'de veri kapisi Yahoo'yu reddetti, daemon exit 1 verdi ve O GUN
        # STOPLAR HIC DEGERLENDIRILMEDI. `if: always()` bunu kirar.
        # KAPIYI BILEREK ATLAR: kapinin reddi SUREKLILIK hakkindadir, anlik fiyat
        # gecerliligi hakkinda degil (olculdu 2026-09-10: reddedilen Yahoo, tutulan
        # pozisyonlarin guncel fiyatini %0.00-0.11 farkla dogru verdi).
        # YALNIZ TESPIT: emir yok, portfolio state mutasyonu yok.
        # Alarm YALNIZ breached'de; `missing` ize gider (alarm korlugu onlemi).
        # Hata gizleyici bayrak KULLANILMAZ: gozlemcinin kendi hatasi gorunur olmali.
        #
        # NEDEN `!= 'false'` (precise.yml'de YOK, burada VAR):
        # Bu dosya haftaici 32 cron tetigi TANIMLIYOR ama GitHub bunlarin cogunu
        # dusuruyor: 2026-09-10 olcumu 4, 09-09 olcumu 6 fiili schedule kosumu
        # (300 kosumluk gecmisten sayildi). Ilk yazdigimda 32'yi FIILI sandim.
        # Karar degismiyor, gerekcenin buyuklugu duzeldi. [DUZELTME 2026-09-11,
        # olculdu: "raporu precise uretiyor, state commit pratikte kosmuyor" YANLIS —
        # bu yol gunici'yi her gun uretiyor ve state commit her gun kosuyor (107
        # "state HHMM" commit). Acilis+kapanis precise'ten, gunici buradan.]
        # Kosulsuz `always()` ile gozlem her fiili tetikte kosar, izi HIC
        # commit'lenmez ve her tetik ayri bir P0.3 alarm yuzeyi acar. Kapi 'false'
        # derken bu
        # workflow zaten IS YAPMIYOR; o tetiklerde gozlem de gereksiz.
        # `== 'true'` DEGIL cunku kapi bozulup bos donerse gozlem yine kosmali —
        # ve bu dosyada bekciyi 40 kosuda 0 kez calistiran hata tam olarak `== 'true'`di.
        # `always()` KORUNUYOR: daemon DUSSE BILE (09-08 vakasi) gozlem kosar.
        if: always() && steps.gate.outputs.run != 'false'
        env:
          TZ: Europe/Istanbul
          STOP_OBS_LABEL: ${{ github.workflow }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          # P0.6 stop observer — bagimsiz kosum, ana rapor yolundan ayri
          python3 scripts/stop_observer_run.py 2>&1 | tee /tmp/stop_obs.log
          rc=${PIPESTATUS[0]}
          if grep -q 'breached=true' /tmp/stop_obs.log; then
            detay="$(grep 'STOP ALTINDA' /tmp/stop_obs.log | head -10)"
            message="$(printf '%s\n' '🛑 STOP ALTINDA POZISYON (bagimsiz gozlem)' 'workflow: ${{ github.workflow }}' 'run: ${{ github.run_id }}' "$detay" '(tespit amaclidir; emir verilmedi, state degismedi)')"
            alarm_rc=0
            if ! resp="$(curl -sfS --retry 2 --connect-timeout 10 --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}")"; then
              echo "::error::stop alarmi HTTP olarak gonderilemedi"
              alarm_rc=1
            elif ! printf '%s' "$resp" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "::error::stop alarmi Telegram tarafindan onaylanmadi"
              alarm_rc=1
            else
              echo "stop alarmi gonderildi"
            fi
          else
            alarm_rc=0
          fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          exit "$alarm_rc"

      - name: P0.6 stop gozlemi ozeti (kosu arayuzunde)
        # Bu adim `stop_obs` cikti degerlerinin TUKETICISIDIR. Onlar
        # GITHUB_OUTPUT'a yaziliyordu ama hicbir sey okumuyordu; yazilip
        # okunmayan yuzey, bu isin duzelttigi kusurun ta kendisi.
        # Ozet kosu sayfasinda gorunur -> "bugun kostu mu, ne dedi" sorusu
        # log acmadan cevaplanir. Panel kalici tuketici, bu kosu-basina olan.
        if: always() && steps.gate.outputs.run != 'false'
        run: |
          {
            echo "### P0.6 bagimsiz stop gozlemi"
            echo ""
            echo "| alan | deger |"
            echo "| --- | --- |"
            echo "| operasyon kapisi | ${{ steps.stop_obs.outputs.gate }} |"
            echo "| stop altinda | ${{ steps.stop_obs.outputs.breached }} |"
            echo "| pozisyon | ${{ steps.stop_obs.outputs.positions }} |"
            echo "| fiyatsiz | ${{ steps.stop_obs.outputs.unpriced }} |"
            echo "| okunamayan hesap | ${{ steps.stop_obs.outputs.state_unavailable }} |"
            echo "| adim sonucu | ${{ steps.stop_obs.outcome }} |"
            echo ""
            echo "Yalniz tespit: emir verilmedi, portfolio state degismedi."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: P0.6 stop izini Actions artefakti olarak sakla
        # Gozlem adimiyla AYNI kosul: adim atlandiginda yuklenecek dosya da yok,
        # aksi halde her bos tetikte "dosya bulunamadi" uyarisi birikir.
        if: always() && steps.gate.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: stop-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/state/stop_observer.json
          if-no-files-found: warn
          retention-days: 90

      - name: Portfoy state commit (kalicilik)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "bist-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f portfolios/ deniz_snapshots/scanner_state.json docs/state/ 2>/dev/null || true
          # P0.5 COMMIT MANIFESTI (precise.yml ile ayni).
          iz="$(python3 -m bist_alpha.run_trace summary 2>/dev/null || echo '[TRACE_CLI_ERR]')"
          git diff --staged --quiet || git commit -m "state $(date +%F_%H%M) ${iz}"
          if ! git push; then
            echo "push hatasi — Telegram bildirim"
            python3 - <<'PYNOTIFY'
          import os, urllib.request, json
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if token and chat:
              msg = "⚠️ BIST Alpha — git push başarısız (state commit kaybolabilir)"
              data = json.dumps({"chat_id": chat, "text": msg}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data, headers={"Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=5)
              except Exception as e:
                  print(f"[notify] {e}")
          PYNOTIFY
          fi

      # P0.3: daemon/checkout/kurulum/state adimlarindan biri duserse, arkadan
      # kosan yesil adimlar arizayi gizlemesin. Report/heartbeat dedup'i YOK:
      # her failure/cancelled olayi ayri bildirilir. Suphede gonder; Telegram
      # basarisi hem HTTP hem response ok:true ile kanitlanir.
      # GitHub force-cancel kosullari atlayabilir; hic baslamayan kosum ve zorla
      # iptal repo-disi pinger kapsamidir. Bu adim normal failure/cancel yoludur.
      - name: P0.3 workflow hata alarmi
        if: ${{ failure() || cancelled() }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_JOB: ${{ github.job }}
          ALERT_STATUS: ${{ job.status }}
          ALERT_EVENT: ${{ github.event_name }}
          ALERT_SCHEDULE: ${{ github.event.schedule }}
          ALERT_REF: ${{ github.ref }}
          ALERT_SHA: ${{ github.sha }}
          ALERT_ACTOR: ${{ github.actor }}
          ALERT_RUN_ID: ${{ github.run_id }}
          ALERT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ALERT_SERVER_URL: ${{ github.server_url }}
          ALERT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_TOKEN:-}" || { echo "::error::TELEGRAM_TOKEN yok"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "::error::TELEGRAM_CHAT_ID yok"; exit 1; }
          message="$(printf '%s\n' \
            '🚨 BIST Alpha uretici workflow hatasi' \
            "workflow: ${ALERT_WORKFLOW}" \
            "job: ${ALERT_JOB}" \
            "status: ${ALERT_STATUS}" \
            "event: ${ALERT_EVENT}" \
            "schedule: ${ALERT_SCHEDULE}" \
            "ref: ${ALERT_REF}" \
            "sha: ${ALERT_SHA}" \
            "actor: ${ALERT_ACTOR}" \
            "run_id: ${ALERT_RUN_ID} / attempt: ${ALERT_RUN_ATTEMPT}" \
            "${ALERT_SERVER_URL}/${ALERT_REPOSITORY}/actions/runs/${ALERT_RUN_ID}")"
          response="$(curl -sfS --retry 2 --connect-timeout 10 --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")"
          printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
