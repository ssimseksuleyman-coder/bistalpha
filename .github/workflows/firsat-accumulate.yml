name: firsat-accumulate

# FIRSAT-defteri (F-eleme-DIAGNOSTIGI) GUVENILIR biriktirir. IZOLE: daemon'dan ayri,
# reports/firsat_ledger.json'a yazar, F/A/B/O/G1'e sifir dokunus (yaprak-modul).
# Simetrik-dagilim + onden-esik + F-DOKUNULMAZ (chase-DEGIL, eleme-kalibrasyonu olcer).
# Dashboard.json'un URETTIGI firsatlar'i okur -> haftalik yakalar (top-momentum isimler gunlerce kalir).

on:
  schedule:
    - cron: '0 6 * * 6'   # Cumartesi 06:00 UTC — daemon/precise yalniz hafta-ici (1-5) -> COMMIT-RACE YOK
  workflow_dispatch:

concurrency:
  group: firsat-accumulate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  accumulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # yfinance/pandas/numpy zaten burada

      - name: FIRSAT-defteri biriktir (izole, look-ahead-siz)
        id: run
        run: |
          set -o pipefail
          OUTPUT=$(python firsat_ledger.py 2>&1) || { echo "$OUTPUT"; echo "RUN_FAILED=1" >> $GITHUB_OUTPUT; exit 0; }
          echo "$OUTPUT"
          HEALTH=$(echo "$OUTPUT" | grep -oE 'HEALTH:.*' | tail -1 || echo "HEALTH: yok")
          echo "health=$HEALTH" >> $GITHUB_OUTPUT
          echo "RUN_FAILED=0" >> $GITHUB_OUTPUT
          # sessiz-bozulma: firsat YAKALANDI ama fiyat-yok (yfinance-fail). caught=0 (sessiz hafta) -> with_price=NA, alarm DEGIL.
          if echo "$HEALTH" | grep -qE 'with_price=0( |$)'; then
            echo "SILENT_FAIL=1" >> $GITHUB_OUTPUT
          else
            echo "SILENT_FAIL=0" >> $GITHUB_OUTPUT
          fi

      - name: Ledger commit (izole, sadece reports/)
        if: steps.run.outputs.RUN_FAILED == '0'
        run: |
          git config user.name "bist-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/firsat_ledger.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok (bu hafta yeni firsat/olgunlasma yok) — commit atlaniyor."
          else
            git commit -m "firsat-defteri: haftalik birikim $(date -u +%Y-%m-%d) [${{ steps.run.outputs.health }}]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "${GITHUB_REF_NAME}" || echo "push atlandi (catisma) — sonraki kosu self-heal"
          fi

      - name: Telegram alarm (sessiz-bozulma ya da hata)
        if: steps.run.outputs.SILENT_FAIL == '1' || steps.run.outputs.RUN_FAILED == '1'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            if [ "${{ steps.run.outputs.RUN_FAILED }}" = "1" ]; then
              MSG="firsat-defteri KOSU HATASI ($(date -u +%Y-%m-%d)) — birikim durdu, kontrol et."
            else
              MSG="firsat-defteri SESSIZ-BOZULMA: firsat yakalandi ama fiyat-yok (with_price=0). yfinance kontrol et."
            fi
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" -d text="$MSG" > /dev/null || echo "Telegram gonderilemedi"
          else
            echo "Telegram secret'lari yok — alarm atlaniyor (sessiz-bozulma VAR, elle kontrol et)."
          fi
