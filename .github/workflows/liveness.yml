name: liveness

# "Yoklugun imzasi yok" panzehiri — zamanlanmis her mekanizmanin son-kosu denetimi.
# IZOLE: daemon'dan ayri, F/A/B/O/G1'e sifir dokunus, yalniz docs/state/liveness.json yazar.
#
# HEARTBEAT TASARIMI (kritik): RED-yoksa-sus DEGIL. Her kosuda Telegram atar.
# Sebep: "alarm gelmiyor" iki sey olabilir -> (a) her sey yesil (iyi),
# (b) TARAYICI OLDU (kotu). Heartbeat olmadan ikisi ayirt edilemez ve tarayici
# kendi izledigi hatanin kurbani olur (sessizce durur, sen "yesil" sanirsin).
# Heartbeat ile: SESSIZLIK = tarayici-oldu sinyali.

on:
  schedule:
    # #1f (2026-09-04): TEK cron 08-26'dan beri KRONIK GEC kosuyordu (+2.5-4.7 sa),
    # iki gun hic kosmadi. bist-alpha.yml'in COKLU-RETRY deseni ayni gunlerde tutturdu.
    # Retry TEK BASINA eklenemezdi: Telegram adimi her kosumda mesaj atiyordu ve
    # "sessizlik = alarm" sozlesmesi gunde N heartbeat ile TERSINDEN bozulurdu.
    # => gunluk tek-heartbeat kapisi ON SARTTIR; ikisi BIRLIKTE gelir.
    - cron: '0 17 * * 1-5'    # hedef 17:00 UTC (20:00 TR)
    - cron: '10 17 * * 1-5'
    - cron: '25 17 * * 1-5'
    - cron: '45 17 * * 1-5'
    - cron: '10 18 * * 1-5'
    - cron: '40 18 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/liveness_scan.py'
      - '.github/workflows/liveness.yml'

concurrency:
  group: liveness
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Liveness taramasi (stdlib-only, bagimlilik yok)
        id: scan
        run: |
          set -o pipefail
          OUT=$(python scripts/liveness_scan.py 2>&1) || SCAN_RED=1
          echo "$OUT"
          HEALTH=$(echo "$OUT" | grep -oE 'HEALTH:.*' | tail -1 || echo "HEALTH: yok")
          echo "health=$HEALTH" >> $GITHUB_OUTPUT
          echo "red=${SCAN_RED:-0}" >> $GITHUB_OUTPUT
          # #1f — gunluk tek-heartbeat kapisi. Satir okunamazsa VARSAYILAN true:
          # supheDE GONDER (sozlesme "sessizlik = alarm"; susmak en tehlikeli yanlis).
          # `|| true` ZORUNLU: adim `set -o pipefail` + Actions varsayilani `bash -e`.
          # Satir yoksa (TARAYICI COKTU) grep non-zero doner ve adim KOMPLE DURUR ->
          # Telegram adimina hic gelinmez = alarm gonderilmez. Fail-open niyeti
          # fail-closed uygulanmis olurdu, hem de tam gerektigi anda.
          DUE=$(echo "$OUT" | grep -oE 'HEARTBEAT_DUE: (true|false)' | tail -1 | awk '{print $2}' || true)
          echo "due=${DUE:-true}" >> $GITHUB_OUTPUT
          # #1f denetim alani: damgaya hangi verdict ile gonderildigi yazilsin.
          VERDICT=$(echo "$OUT" | grep -oE 'verdict=[A-Z]+' | tail -1 | cut -d= -f2 || true)
          echo "verdict=${VERDICT:-unknown}" >> $GITHUB_OUTPUT
          # Kirmizi satirlari mesaja koy (ilk 5)
          REDLINES=$(echo "$OUT" | grep -E '^\s*!!' | head -5 | sed 's/^[[:space:]]*//' || true)
          {
            echo "redlines<<EOF"
            echo "${REDLINES:-yok}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: liveness.json commit
        run: |
          git config user.name "bist-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/state/liveness.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok — commit atlaniyor."
          else
            git commit -m "liveness $(date -u +%F_%H%M) [${{ steps.scan.outputs.health }}]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "${GITHUB_REF_NAME}" || echo "push atlandi (catisma) — sonraki kosu self-heal"
          fi

      - name: Telegram — ALARM her zaman, heartbeat gunde bir (#1f)
        id: tg
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "sent=false" >> $GITHUB_OUTPUT
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secret'lari yok — mesaj atlaniyor."; exit 0
          fi
          # #1f KAPI: RED her zaman gonderilir (dedup ALARM'a UYGULANMAZ).
          # GREEN/YELLOW yalniz gunun ILK gonderiminde.
          if [ "${{ steps.scan.outputs.red }}" != "1" ] && [ "${{ steps.scan.outputs.due }}" != "true" ]; then
            echo "heartbeat bugun zaten gonderildi -> sessiz (retry kosumu)"; exit 0
          fi
          NL=$'\n'
          if [ "${{ steps.scan.outputs.red }}" = "1" ]; then
            MSG="🔴 LIVENESS ALARM ($(date -u +%F))${NL}${{ steps.scan.outputs.health }}"
            MSG="${MSG}${NL}${NL}KIRMIZI:${NL}${{ steps.scan.outputs.redlines }}"
            # Metin KIRMIZI'nin gercek anlamina kalibre (2026-07-22): yeni eklenen
            # uyeler artik SARI ("henuz hic yazilmadi"), yani KIRMIZI gercekten
            # "calisiyordu, artik calismiyor" YA DA "kontrol bozuldu" demek.
            # Eski metin ("bir is DURMUS olabilir") 12. uye eklenince yaniltmisti:
            # duran bir is yoktu, uye yeniydi.
            MSG="${MSG}${NL}${NL}Bir zamanlanmis is DURDU ya da bir kontrol BOZULDU — dashboard > Canlilik blogunu kontrol et. (Yeni eklenen uyeler SARI raporlanir, KIRMIZI degil.)"
          else
            # HEARTBEAT: yesil/sari da bildirilir ki SESSIZLIK = tarayici-oldu olsun.
            MSG="🟢 liveness heartbeat ($(date -u +%F)) — ${{ steps.scan.outputs.health }}"
            MSG="${MSG}${NL}(Bu mesaj kesilirse TARAYICI durmustur; sessizlik = alarm.)"
          fi
          # `-f` KRITIK: -f YOKKEN curl HTTP 400/401'de bile exit 0 doner ve API
          # REDDI BASARI sayilirdi -> damga yanlis yazilir, gunun heartbeat'i kaybolurdu.
          URL="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          # IKI KATMANLI BASARI: (1) HTTP basari (`-f`; -f yoksa curl 400/401'de bile
          # exit 0 doner) VE (2) Telegram cevabinda `"ok":true`. Yalnizca HTTP yeterli
          # degil — API 200 donup govdede hata bildirebilir.
          RESP=$(curl -sf -X POST "$URL" -d chat_id="${TG_CHAT}" -d text="$MSG" || true)
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "sent=true" >> $GITHUB_OUTPUT
            echo "Telegram gonderildi"
          else
            echo "Telegram GONDERILEMEDI — damga yazilmayacak, sonraki retry dener"
          fi

      # #1f — damga YALNIZ gercek gonderimden SONRA. Once yazilsaydi basarisiz bir
      # gonderim gunun heartbeat'ini tamamen susturur = spam'den KOTU.
      - name: Heartbeat damgasi (yalniz gonderim basariliysa)
        if: steps.tg.outputs.sent == 'true'
        env:
          HB_VERDICT: ${{ steps.scan.outputs.verdict }}
          HB_HEALTH: ${{ steps.scan.outputs.health }}
        run: |
          python scripts/liveness_scan.py --heartbeat-mark
          git config user.name "bist-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/state/liveness_heartbeat.json
          if git diff --cached --quiet; then
            echo "damga degismedi — commit atlaniyor."
          else
            git commit -m "liveness heartbeat damgasi $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "${GITHUB_REF_NAME}" || echo "push atlandi (catisma) — sonraki kosu self-heal"
          fi
