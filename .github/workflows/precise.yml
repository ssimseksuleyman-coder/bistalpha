# TAM-ZAMANLI raporlama — GitHub cron gecikmesini yener (uyu-tam-saatte-calis).
# Cron'lar slot'tan SAATLER ONCE tetiklenir; precise_runner.py tam slot saatine
# UYUR, sonra daemon'u calistirir -> rapor GEC degil TAM ZAMANINDA cikar.
# Repo PUBLIC -> Actions dakikasi sinirsiz -> uyku bedava. Dis hesap/PAT GEREKMEZ.
#
# Native bist-alpha.yml (genis pencere) FALLBACK olarak kalir: precise cron'u
# duserse native gecikmeli de olsa yakalar. Ayni report_runs.json'i paylasirlar ->
# precise once isaretler -> native atlar (cift-Telegram yok).

name: BIST Tam-Zamanli (precise)

on:
  schedule:
    - cron: '0 2 * * 1-5'    # acilis (hedef 06:45 UTC=09:45 TR) icin erken -> uyur
    - cron: '30 7 * * 1-5'   # gunici (hedef 11:30 UTC=14:30 TR)
    - cron: '0 12 * * 1-5'   # kapanis (hedef 15:40 UTC=18:40 TR)
  workflow_dispatch:
    inputs:
      force_fail:
        description: "P0.3 hata alarmi kanalini kontrollu olarak sina"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Uzun uyuyan precise job native/manual rapor kuyruğunu kilitlemesin.
  # Çift rapor koruması report_runs.json üzerinden yapılır.
  group: bist-alpha-precise
  cancel-in-progress: false

jobs:
  precise:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # uyku (max ~5.5s) + calisma icin
    steps:
      - name: P0.3 kontrollu hata testi
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fail }}
        run: |
          echo "::error::P0.3 kontrollu hata — alarm kanali sinaniyor"
          exit 1

      - uses: actions/checkout@v4
      - name: En son state'i al
        run: git pull --rebase --autostash || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Tam slot saatine uyu + daemon calistir
        env:
          TZ: Europe/Istanbul
          DATA_SOURCE: yahoo
          DATA_FALLBACK_CHAIN: "borsapy,file"
          ALLOW_FILE_FALLBACK: "0"
          YAHOO_BATCH_SIZE: "60"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DENIZ_SOURCE: scanner
        run: python3 precise_runner.py

      # SEVIYE-2 BEKCI: daemon -> tarayici capraz-kontrolu.
      # BURADA olmali: daemon'u fiilen kosturan workflow bu (precise_runner.py).
      # 2026-07-22 bulgusu: bekci once bist-alpha.yml'ye baglanmisti, orada
      # `gate.run` hic 'true' olmuyor (raporu bu workflow uretiyor) -> 40 kosuda
      # 0 KEZ CALISTI. "Adim workflow'da tanimli" != "adim kostu"; adimin
      # `conclusion` alanina bakilmadigi icin sessizce olu kaldi.
      # KOSUL YOK (gate yok) -> her precise kosusunda calisir.
      # continue-on-error: alarm Telegram'dan gider, daemon'un kendi
      # yesil/kirmizi sinyali kirletilmez.
      - name: Bekci — liveness tarayicisi canli + tutarli mi
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/liveness_watchdog.py

      # ANLAMLILIK TARAYICISI: canlilik degil, uretilen veri DOLU+TUTARLI mi.
      # daemon dashboard.json yazdiktan SONRA kosar (icerik-anomali okur).
      # RS5 tatil-deligi / evren-cokusu -> alarm (bekci/liveness bunu goremez:
      # onlar canlilik olcer, bu anlamlilik). Kendi content_sanity.json'unu yazar
      # -> 13. liveness uyesi okur. continue-on-error: bekci gibi, daemon
      # sinyalini kirletmez. Bugun (07-23) planned'dan active'e ilk gercek kosum.
      - name: Anlamlilik — content_sanity (icerik-anomali)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/content_sanity.py

      - name: P0.6 stop gozlemi (bagimsiz, her kosuda)
        # `id` VAR cunku runner GITHUB_OUTPUT'a breached/unpriced/positions/gate
        # yaziyor; id olmadan bu ciktilar hicbir yerden adreslenemez ve yazilip
        # okunmayan bir yuzey olarak kalirdi.
        id: stop_obs
        # P0.6/madde-7 — bagimsiz stop observer. Ana yol (daemon) DUSSE BILE calisir:
        # 2026-09-08'de veri kapisi Yahoo'yu reddetti, daemon exit 1 verdi ve O GUN
        # STOPLAR HIC DEGERLENDIRILMEDI. `if: always()` bunu kirar.
        # KAPIYI BILEREK ATLAR: kapinin reddi SUREKLILIK hakkindadir, anlik fiyat
        # gecerliligi hakkinda degil (olculdu 2026-09-10: reddedilen Yahoo, tutulan
        # pozisyonlarin guncel fiyatini %0.00-0.11 farkla dogru verdi).
        # YALNIZ TESPIT: emir yok, portfolio state mutasyonu yok.
        # Alarm YALNIZ breached'de; `missing` ize gider (alarm korlugu onlemi).
        # Hata gizleyici bayrak KULLANILMAZ: gozlemcinin kendi hatasi gorunur olmali.
        if: always()
        env:
          TZ: Europe/Istanbul
          STOP_OBS_LABEL: ${{ github.workflow }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          # P0.6 stop observer — bagimsiz kosum, ana rapor yolundan ayri
          python3 scripts/stop_observer_run.py 2>&1 | tee /tmp/stop_obs.log
          rc=${PIPESTATUS[0]}
          if grep -q 'breached=true' /tmp/stop_obs.log; then
            detay="$(grep 'STOP ALTINDA' /tmp/stop_obs.log | head -10)"
            message="$(printf '%s\n' '🛑 STOP ALTINDA POZISYON (bagimsiz gozlem)' 'workflow: ${{ github.workflow }}' 'run: ${{ github.run_id }}' "$detay" '(tespit amaclidir; emir verilmedi, state degismedi)')"
            alarm_rc=0
            if ! resp="$(curl -sfS --retry 2 --connect-timeout 10 --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}")"; then
              echo "::error::stop alarmi HTTP olarak gonderilemedi"
              alarm_rc=1
            elif ! printf '%s' "$resp" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "::error::stop alarmi Telegram tarafindan onaylanmadi"
              alarm_rc=1
            else
              echo "stop alarmi gonderildi"
            fi
          else
            alarm_rc=0
          fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          exit "$alarm_rc"

      - name: P0.6 stop gozlemi ozeti (kosu arayuzunde)
        # Bu adim `stop_obs` cikti degerlerinin TUKETICISIDIR. Onlar
        # GITHUB_OUTPUT'a yaziliyordu ama hicbir sey okumuyordu; yazilip
        # okunmayan yuzey, bu isin duzelttigi kusurun ta kendisi.
        # Ozet kosu sayfasinda gorunur -> "bugun kostu mu, ne dedi" sorusu
        # log acmadan cevaplanir. Panel kalici tuketici, bu kosu-basina olan.
        if: always()
        run: |
          {
            echo "### P0.6 bagimsiz stop gozlemi"
            echo ""
            echo "| alan | deger |"
            echo "| --- | --- |"
            echo "| operasyon kapisi | ${{ steps.stop_obs.outputs.gate }} |"
            echo "| stop altinda | ${{ steps.stop_obs.outputs.breached }} |"
            echo "| pozisyon | ${{ steps.stop_obs.outputs.positions }} |"
            echo "| fiyatsiz | ${{ steps.stop_obs.outputs.unpriced }} |"
            echo "| okunamayan hesap | ${{ steps.stop_obs.outputs.state_unavailable }} |"
            echo "| adim sonucu | ${{ steps.stop_obs.outcome }} |"
            echo ""
            echo "Yalniz tespit: emir verilmedi, portfolio state degismedi."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: P0.6 stop izini Actions artefakti olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/state/stop_observer.json
          if-no-files-found: warn
          retention-days: 90

      - name: State commit (kalicilik)
        if: always()
        run: |
          git config user.name "bist-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f portfolios/ deniz_snapshots/scanner_state.json docs/state/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "precise state $(date +%F_%H%M)"
          git pull --rebase --autostash 2>/dev/null || true
          git push || echo "push atlandi (catisma/degisiklik yok)"

      # P0.3: daemon/checkout/kurulum/state adimlarindan biri duserse, arkadan
      # kosan yesil adimlar arizayi gizlemesin. Report/heartbeat dedup'i YOK:
      # her failure/cancelled olayi ayri bildirilir. Suphede gonder; Telegram
      # basarisi hem HTTP hem response ok:true ile kanitlanir.
      # GitHub force-cancel kosullari atlayabilir; hic baslamayan kosum ve zorla
      # iptal repo-disi pinger kapsamidir. Bu adim normal failure/cancel yoludur.
      - name: P0.3 workflow hata alarmi
        if: ${{ failure() || cancelled() }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_JOB: ${{ github.job }}
          ALERT_STATUS: ${{ job.status }}
          ALERT_EVENT: ${{ github.event_name }}
          ALERT_SCHEDULE: ${{ github.event.schedule }}
          ALERT_REF: ${{ github.ref }}
          ALERT_SHA: ${{ github.sha }}
          ALERT_ACTOR: ${{ github.actor }}
          ALERT_RUN_ID: ${{ github.run_id }}
          ALERT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ALERT_SERVER_URL: ${{ github.server_url }}
          ALERT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_TOKEN:-}" || { echo "::error::TELEGRAM_TOKEN yok"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "::error::TELEGRAM_CHAT_ID yok"; exit 1; }
          message="$(printf '%s\n' \
            '🚨 BIST Alpha uretici workflow hatasi' \
            "workflow: ${ALERT_WORKFLOW}" \
            "job: ${ALERT_JOB}" \
            "status: ${ALERT_STATUS}" \
            "event: ${ALERT_EVENT}" \
            "schedule: ${ALERT_SCHEDULE}" \
            "ref: ${ALERT_REF}" \
            "sha: ${ALERT_SHA}" \
            "actor: ${ALERT_ACTOR}" \
            "run_id: ${ALERT_RUN_ID} / attempt: ${ALERT_RUN_ATTEMPT}" \
            "${ALERT_SERVER_URL}/${ALERT_REPOSITORY}/actions/runs/${ALERT_RUN_ID}")"
          response="$(curl -sfS --retry 2 --connect-timeout 10 --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")"
          printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
